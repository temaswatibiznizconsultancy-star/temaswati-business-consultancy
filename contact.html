<form
  class="quote-form"
  id="quote-form"
  action="https://formspree.io/f/maeqgdwp"
  method="POST"
>
  <h2>Request a quotation</h2>

  <p>
    Complete the form below and submit your enquiry.
    Our team will respond using the email address you provide.
  </p>

  <label for="name">Your name *</label>
  <input
    id="name"
    name="name"
    type="text"
    required
    autocomplete="name"
  >

  <label for="business">Business name (if applicable)</label>
  <input
    id="business"
    name="business"
    type="text"
    autocomplete="organization"
  >

  <label for="email">Your email *</label>
  <input
    id="email"
    name="email"
    type="email"
    required
    autocomplete="email"
  >

  <label for="service">Service you need *</label>
  <select id="service" name="service" required>
    <option value="">Choose a service</option>
    <option value="Business registration support">
      Business registration support
    </option>
    <option value="CSD registration or update">
      CSD registration or update
    </option>
    <option value="Company profile">Company profile</option>
    <option value="Business plan">Business plan</option>
    <option value="Business documents">Business documents</option>
    <option value="Funding application preparation">
      Funding application preparation
    </option>
    <option value="Business administration support">
      Business administration support
    </option>
    <option value="Other / not sure">Other / not sure</option>
  </select>

  <label for="message">Tell us briefly what you need *</label>
  <textarea
    id="message"
    name="message"
    rows="5"
    required
  ></textarea>

  <input
    type="hidden"
    name="_subject"
    value="New Website Enquiry - Temaswati Business Consultancy"
  >

  <button class="button button-red" type="submit">
    Submit Enquiry
  </button>

  <p class="form-note">
    Your enquiry will be processed securely through our
    website form service.
  </p>
</form>
